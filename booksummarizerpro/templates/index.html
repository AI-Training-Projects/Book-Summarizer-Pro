<!-- Frontend upload & preview interface -->
<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookSummarizerPro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Book Summarizer Pro</h1>
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Summarize</button>
    </form>

	<div id="progress-container" style="display: none;">
        <h3>Processing File...</h3>
        <div class="progress">
            <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;">0%</div>
        </div>
    </div>

    {% if summary %}
        <h2>Summary</h2>
        <p>{{ summary }}</p>
        <h3>Download</h3>
        <ul>
            {% for format, link in links.items() %}
                <li><a href="{{ url_for('download_file', filename=link) }}">{{ format }}</a></li>
            {% endfor %}
        </ul>
    {% endif %}
    <nav>
        <a href="/appadmin">AppAdmin</a> |
        <a href="/logs">Logs</a>
    </nav>
	<script>
		function startProgress(taskId) {
			document.getElementById('progress-container').style.display = 'block';
			const eventSource = new EventSource('/progress/' + taskId);

			eventSource.onmessage = function(event) {
				const data = JSON.parse(event.data);
				const progressBar = document.getElementById('progress-bar');

				if (data.progress >= 0) {
					progressBar.style.width = data.progress + '%';
					progressBar.textContent = Math.round(data.progress) + '%';
				}

				if (data.status === 'complete' || data.progress >= 100) {
					eventSource.close();
					location.reload();  // Reload to show results
				}
			};
		}
		{% if task_id %}
			startProgress({{ task_id }});
		{% endif %}
	</script>
</body>
</html>
